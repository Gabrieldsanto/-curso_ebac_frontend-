<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="produtos">
        <div class="produto">
            <img class="produto__imagem" src="./images/1.jpg" alt="Imagem do perfume Aurora Essence">
            <h4 class="produto__nome">Aurora Essence</h4>
            <p class="produto__descricao">
                Uma fragrância elegante e envolvente, com notas florais suaves e um toque marcante.
            </p>
        </div>

        <div class="produto produto--destaque">
            <img class="produto__imagem" src="./images/2.jpg" alt="Imagem do perfume Noir Éclat">
            <h4 class="produto__nome">Noir Éclat</h4>
            <p class="produto__descricao">
                Uma fragrância sofisticada e intensa, com notas amadeiradas suaves e um toque marcante.
            </p>
        </div>

        <div class="produto">
            <img class="produto__imagem" src="./images/3.jpg" alt="Imagem do perfume Velour Blanc">
            <h4 class="produto__nome">Velour Blanc</h4>
            <p class="produto__descricao">
                Uma fragrância delicada e refinada, com notas cítricas suaves e um toque marcante.
            </p>
        </div>
    </div>
</body>
</html>
